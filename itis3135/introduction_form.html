<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shea Stanton's Swift Shark | ITIS3135 | Introduction Form</title>
  <link rel="stylesheet" href="styles/default.css">
  <link rel="icon" type="image/x-icon" href="images/faviconss.ico">
  <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>

<body>
  <div data-include="components/header.html"></div>

  <main>
    <h2>Introduction Form</h2>

    <section id="form-section">
      <h3>Please submit the form below.</h3>

      <form id="form">
        <fieldset>
          <legend>Name Information</legend>

          <label for="first-name">First Name:</label>
          <input 
            type="text" 
            id="first-name" 
            name="firstName" 
            value="Shea" 
            placeholder="Enter your first name" 
            required
          >

          <label for="middle-name">Middle Name or Initial:</label>
          <input 
            type="text" 
            id="middle-name" 
            name="middleName" 
            value="S." 
            placeholder="Enter your middle name or initial"
          >

          <label for="nickname">Nickname or Preferred Name:</label>
          <input 
            type="text" 
            id="nickname" 
            name="nickname" 
            value="Shea" 
            placeholder="Enter your nickname or preferred name"
          >

          <label for="last-name">Last Name:</label>
          <input 
            type="text" 
            id="last-name" 
            name="lastName" 
            value="Stanton" 
            placeholder="Enter your last name" 
            required
          >
        </fieldset>

        <fieldset>
          <legend>Introduction Header Details</legend>

          <label for="acknowledgment">Acknowledgment Statement:</label>
          <input 
            type="text" 
            id="acknowledgment" 
            name="acknowledgment" 
            value="I understand that this page is part of my ITIS3135 coursework." 
            placeholder="Enter your acknowledgment statement" 
            required
          >

          <label for="acknowledgment-date">Acknowledgment Date:</label>
          <input 
            type="text"
            id="acknowledgment-date"
            name="acknowledgmentDate"
            value="2026-06-28"
            placeholder="YYYY-MM-DD"
            pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}"
            required
          >

          <label for="mascot-adjective">Mascot Adjective:</label>
          <input 
            type="text" 
            id="mascot-adjective" 
            name="mascotAdjective" 
            value="Swift" 
            placeholder="Example: Swift" 
            required
          >

          <label for="mascot-animal">Mascot Animal:</label>
          <input 
            type="text" 
            id="mascot-animal" 
            name="mascotAnimal" 
            value="Shark" 
            placeholder="Example: Shark" 
            required
          >

          <label for="divider">Divider:</label>
          <input 
            type="text" 
            id="divider" 
            name="divider" 
            value="|" 
            placeholder="Example: |, ~, ♥" 
            required
          >
        </fieldset>

        <fieldset>
          <legend>Picture Information</legend>

          <p>
            Current default picture:
          </p>

          <img 
            id="picture-preview" 
            src="images/selfie3135intro.jpeg" 
            alt="introduction photo" 
            width="250"
          >

          <input 
            type="hidden" 
            id="default-picture" 
            name="defaultPicture" 
            value="images/selfie3135intro.jpeg"
          >

          <label for="picture">Upload Your Own Picture:</label>
          <input 
            type="file" 
            id="picture" 
            name="picture" 
            accept="image/*"
          >

          <label for="picture-caption">Picture Caption:</label>
          <input 
            type="text" 
            id="picture-caption" 
            name="pictureCaption" 
            value="A picture that represents me." 
            placeholder="Enter a caption for your picture" 
            required
          >
        </fieldset>

        <fieldset>
          <legend>Personal Introduction</legend>

          <label for="personal-statement">Personal Statement:</label>
          <textarea 
            id="personal-statement" 
            name="personalStatement" 
            placeholder="Write a short personal statement" 
            required
          >Hello, my name is Shea Stanton. I am excited to continue learning web design and development through this course.</textarea>

          <label for="personal-background">Personal Background:</label>
          <textarea 
            id="personal-background" 
            name="personalBackground" 
            placeholder="Write about your personal background" 
            required
          >I enjoy learning new skills, working on creative projects, and improving my knowledge of technology.</textarea>

          <label for="professional-background">Professional Background:</label>
          <textarea 
            id="professional-background" 
            name="professionalBackground" 
            placeholder="Write about your professional background" 
            required
          >My professional background includes experience developing responsibility, communication, and problem-solving skills.</textarea>

          <label for="academic-background">Academic Background:</label>
          <textarea 
            id="academic-background" 
            name="academicBackground" 
            placeholder="Write about your academic background" 
            required
          >I am currently studying at UNC Charlotte and working on improving my web development skills.</textarea>

          <label for="subject-background">Background in This Subject:</label>
          <textarea 
            id="subject-background" 
            name="subjectBackground" 
            placeholder="Write about your background in web development or computing" 
            required
          >I have been learning HTML, CSS, and JavaScript, and I am building stronger confidence with each assignment.</textarea>

          <label for="platform">Primary Computer Platform:</label>
          <input 
            type="text" 
            id="platform" 
            name="platform" 
            value="MacBook / macOS" 
            placeholder="Example: Windows laptop, MacBook, Linux desktop" 
            required
          >

          <label for="learning-goals">Learning Goals:</label>
          <textarea 
            id="learning-goals" 
            name="learningGoals" 
            placeholder="Write what you want to learn in this course" 
            required
          >I want to become more comfortable creating clean, organized, and functional websites.</textarea>

          <label for="design-style">Design Style or Personal Interest:</label>
          <textarea 
            id="design-style" 
            name="designStyle" 
            placeholder="Write about your design style or personal interests" 
            required
          >I like simple, clean layouts that are easy to read and navigate.</textarea>
        </fieldset>

        <fieldset>
          <legend>Courses</legend>

        <p>Add the courses you are taking and why you are taking them.</p>

  <div id="courses-container">
    <div class="course-entry">
      <label for="course-department-1">Department:</label>
      <input 
        type="text" 
        id="course-department-1"
        name="courseDepartment[]" 
        value="ITIS" 
        placeholder="Example: ITIS" 
        required
      >

      <label for="course-number-1">Course Number:</label>
      <input 
        type="text" 
        id="course-number-1"
        name="courseNumber[]" 
        value="3135" 
        placeholder="Example: 3135" 
        required
      >

      <label for="course-name-1">Course Name:</label>
      <input 
        type="text" 
        id="course-name-1"
        name="courseName[]" 
        value="Web-Based Application Design and Development" 
        placeholder="Example: Web-Based Application Design and Development" 
        required
      >

      <label for="course-reason-1">Reason for Taking:</label>
      <input 
        type="text" 
        id="course-reason-1"
        name="courseReason[]" 
        value="I am taking this course to improve my web design and coding skills." 
        placeholder="Explain why you are taking this course" 
        required
      >
    </div>
  </div>

  <button type="button" id="add-course">Add Course</button>
</fieldset>

        <fieldset>
          <legend>Quote and Extras</legend>

          <label for="quote">Quote:</label>
          <input 
            type="text" 
            id="quote" 
            name="quote" 
            value="You will never realize the value of a moment until it becomes a memory." 
            placeholder="Enter a quote" 
            required
          >

          <label for="quote-author">Quote Author:</label>
          <input 
            type="text" 
            id="quote-author" 
            name="quoteAuthor" 
            value="Shea Stanton" 
            placeholder="Enter the quote author" 
            required
          >

          <label for="funny-thing">Funny Thing:</label>
          <input 
            type="text" 
            id="funny-thing" 
            name="funnyThing" 
            value="I sometimes spend more time fixing small design details than writing the actual content in order to perfect my craft." 
            placeholder="Share something funny or interesting"
          >

          <label for="share">Something I Would Like to Share:</label>
          <input 
            type="text" 
            id="share" 
            name="share" 
            value="I am looking forward to seeing my website improve throughout the semester." 
            placeholder="Share anything else you would like"
          >
        </fieldset>

        <fieldset>
          <legend>Links</legend>

          <label for="link-one-name">Link 1 Name:</label>
          <input 
            type="text" 
            id="link-one-name" 
            name="linkName[]" 
            value="LinkedIn" 
            placeholder="Example: LinkedIn"
          >

          <label for="link-one-url">Link 1 URL:</label>
          <input 
            type="url" 
            id="link-one-url" 
            name="linkUrl[]" 
            value="https://www.linkedin.com/in/sheastanton/" 
            placeholder="https://www.linkedin.com"
          >

          <label for="link-two-name">Link 2 Name:</label>
          <input 
            type="text" 
            id="link-two-name" 
            name="linkName[]" 
            value="GitHub" 
            placeholder="Example: GitHub"
          >

          <label for="link-two-url">Link 2 URL:</label>
          <input 
            type="url" 
            id="link-two-url" 
            name="linkUrl[]" 
            value="https://github.com/sheastanton/sheastanton.github.io" 
            placeholder="https://github.com"
          >

          <label for="link-three-name">Link 3 Name:</label>
          <input 
            type="text" 
            id="link-three-name" 
            name="linkName[]" 
            value="Charlotte Webpage" 
            placeholder="Example: Charlotte Webpage"
          >

          <label for="link-three-url">Link 3 URL:</label>
          <input 
            type="url" 
            id="link-three-url" 
            name="linkUrl[]" 
            value="https://webpages.charlotte.edu/bstanto1/" 
            placeholder="https://webpages.charlotte.edu"
          >

          <label for="link-four-name">Link 4 Name:</label>
          <input 
            type="text" 
            id="link-four-name" 
            name="linkName[]" 
            value="Codecademy" 
            placeholder="Example: Codecademy"
          >

          <label for="link-four-url">Link 4 URL:</label>
          <input 
            type="url" 
            id="link-four-url" 
            name="linkUrl[]" 
            value="https://www.codecademy.com/profiles/sheastanton" 
            placeholder="https://www.codecademy.com"
          >

          <label for="link-five-name">Link 5 Name:</label>
          <input 
            type="text" 
            id="link-five-name" 
            name="linkName[]" 
            value="FreeCodeCamp" 
            placeholder="Example: FreeCodeCamp"
          >

          <label for="link-five-url">Link 5 URL:</label>
          <input 
            type="url" 
            id="link-five-url" 
            name="linkUrl[]" 
            value="https://www.freecodecamp.org/sheastanton" 
            placeholder="https://www.freecodecamp.org"
          >
        </fieldset>

        <div class="form-buttons">
          <button type="submit">Submit</button>
          <button type="reset">Reset</button>
          <button type="button" id="clear-form">Clear</button>
          <button type="button" id="generate-html">Generate HTML</button>
          <button type="button" id="generate-json">Generate JSON</button>
          <button type="button" id="generate-xml">Generate XML</button>
        </div>
      </form>
    </section>

    <div id="result-section"></div>

      <section id="code-output-section" class="home-note">
        <h3>Generated Raw Code</h3>
        <div id="code-output"></div>
      </section>
  </main>

  <div data-include="components/footer.html"></div>

  <script src="scripts/HTMLInclude.min.js"></script>
  <script src="scripts/introduction.js"></script>
</body>
</html>
